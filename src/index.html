<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./output.css" rel="stylesheet">
    <title>BMI Calculator</title>
</head>
<body class="bg-gray-200">
    <!-- navbar starts here -->
    <nav>
        <div class="font-bold text-6xl flex justify-center items-center pt-2 ">⚖️ BMI Calculator</div>
        <p class="font-light text-gray-400 text-xl flex justify-center items-center pt-2 pl-4">Check your body mass index in seconds</p>
    </nav>
    <!-- navbar ends here -->

     <!-- form starts here -->

     <!-- inputs start here -->
     <form class="mt-20">
        <div class="flex justify-center items-center">
            <label class="font-light text-gray-700 text-xl pr-2">Height in CM:</label><input type="text" id="height" placeholder="Enter your Height" class="border-2 border-gray-400 rounded-md h-10 w-72 ">
        </div>
        <div class="flex justify-center items-center mt-6">
            <label class="font-light text-gray-700 text-xl pr-2">Weight in KG:</label><input type="text" id="weight" placeholder="Enter your Weight" class="border-2 border-gray-400 rounded-md h-10 w-72 ">
        </div>
        <div class="flex justify-center items-center mt-8">
            <button class="text-3xl font-bold text-white border-3 rounded-lg border-gray-300 bg-gray-700 p-2">Calculate BMI</button>
        </div>
        <!-- inputs end here -->

        <!-- result display here -->
         <div id="result" class="flex justify-center items-center text-xl font-bold mt-6"></div>

         <!-- BMI Weight guide starts here -->
          <div class="mt-8 text-2xl">
            <div class="flex justify-center items-center">BMI Weight Guide</div>
            <div class="flex justify-center items-center mt-8">Underweight = Less than 18.6</div>
            <div class="flex justify-center items-center mt-5">Normal Range = 18.6 to 24.9</div>
            <div class="flex justify-center items-center mt-5">Overweight = Greater than 24.9</div>
          </div>
          <!-- BMI Weight guide ends here -->

     </form>
     

</body>
</html>
